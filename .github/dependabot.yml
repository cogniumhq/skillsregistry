# Dependabot — weekly bumps for the three ecosystems this repo owns.
# One open PR per ecosystem (all updates grouped) so the self-hosted
# runner is not flooded. Known-incompatible majors are ignored and
# need a dedicated migration, not an automated bump.
# Dependabot security updates, if enabled, are a GitHub
# repo-settings toggle separate from this file (see CONTRIBUTING.md).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hono/zod-openapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hono/node-server"
        update-types: ["version-update:semver-major"]
      - dependency-name: node-cron
        update-types: ["version-update:semver-major"]
      - dependency-name: pino
        update-types: ["version-update:semver-major"]
      - dependency-name: pino-pretty
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    # apps/local/Dockerfile (node:22-alpine build + runtime stages)
    directory: /apps/local
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

name: Publish SDK packages

on:
  push:
    branches: [main]

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version + publish @skillsregistry/*
    runs-on: [self-hosted, grace]
    # Containerised to match ci.yml. Those jobs run as root and leave
    # root-owned files in the shared runner workspace, so a bare-metal job here
    # would fail at checkout with "Permission denied" while cleaning.
    container:
      image: node:22-bookworm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # changesets commits and pushes, and the container runs as root over a
      # runner-owned checkout, so git would reject the repo as dubious
      # ownership. actions/checkout registers safe.directory only in a
      # temporary config its own steps see.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publishing needs NPM_TOKEN; opening the version PR does not. Without
      # this the job would fail on every push to main until the token exists,
      # and would take the release-PR flow down with it. Empty `publish-script`
      # makes changesets do versioning only.
      - name: Is npm publishing configured?
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set - versioning only, no publish to registry.npmjs.org."
          fi

      - name: Report SDK deployment start
        if: steps.npm.outputs.configured == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: npm
          CHANGE_MONITOR_SERVICE: skillsregistry-sdk
          DEPLOY_VERSION: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/report-rollouts-deployment.sh bootstrap
          bash scripts/report-rollouts-deployment.sh start

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: ${{ steps.npm.outputs.configured == 'true' && 'pnpm release' || '' }}
          version-script: pnpm version
          pr-title: "chore: version @skillsregistry/* packages"
          commit-message: "chore: version @skillsregistry/* packages"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report SDK deployment result
        if: always() && steps.npm.outputs.configured == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: npm
          CHANGE_MONITOR_SERVICE: skillsregistry-sdk
          DEPLOY_VERSION: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_OUTCOME: ${{ steps.changesets.outcome == 'success' && 'succeeded' || (steps.changesets.outcome == 'cancelled' && 'aborted' || 'failed') }}
          DEPLOY_FAILURE_MESSAGE: Changesets publish ${{ steps.changesets.outcome }}
        run: bash scripts/report-rollouts-deployment.sh finish

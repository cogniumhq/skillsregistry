# CodeQL — JavaScript/TypeScript analysis for this repo.
# Job `name:` is the GitHub check context. Keep it stable if this becomes
# a required check on main (suggested after a green streak).
#
# GitHub-hosted: the CodeQL CLI is not installed on the grace runner.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 04:17 UTC (offset from the hour to avoid thundering herd).
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Exact check context for a future ruleset entry. No matrix — GitHub
    # appends matrix keys to the displayed name (`CodeQL (javascript-typescript, none)`).
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

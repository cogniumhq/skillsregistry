name: Integration Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-airgap:
    name: docker compose + air-gap smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI env
        working-directory: apps/local
        run: |
          ADMIN_TOKEN="$(openssl rand -hex 32)"
          printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN" > .env
          printf 'LOG_LEVEL=warn\n' >> .env

      - name: Boot stack
        working-directory: apps/local
        run: docker compose up -d --build --wait

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run air-gap smoke
        working-directory: apps/local
        env:
          BASE_URL: http://localhost:3000
          HEALTH_TIMEOUT: 120
        run: ./scripts/smoke-airgap.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Seed eval catalog
        env:
          DATABASE_URL: postgres://skillsregistry:skillsregistry@localhost:5432/skillsregistry
          OLLAMA_URL: http://localhost:11434
          EMBEDDER: ollama
          ADMIN_TOKEN: ci-seed-token
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @skillsregistry/local seed:eval

      - name: Run eval gate (R@5 ≥ 75%)
        run: |
          pnpm --filter @skillsregistry/eval exec skillsregistry-eval \
            --endpoint http://localhost:3000/v1/search \
            --tenant local \
            --limit 5 \
            --min-recall5 0.75 \
            --show-failed

      - name: Tear down
        if: always()
        working-directory: apps/local
        run: docker compose down -v --remove-orphans
